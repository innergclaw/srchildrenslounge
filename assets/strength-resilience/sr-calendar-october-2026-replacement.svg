<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">October 2026 calendar</title>
  <desc id="desc">October 2026 events calendar for SR Sensory Gym, sized and positioned to match the provided reference layout.</desc>

  <defs>
    <style>
