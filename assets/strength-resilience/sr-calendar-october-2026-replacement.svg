      .soft3 { fill: #f1d9a1; }
      .red { fill: #ee5f58; }
      .orange { fill: #ee8c46; }
      .empty { fill: #f8f7f5; }
      .month { font: 900 94px 'Arial', sans-serif; letter-spacing: -4.5px; }
      .dow { font: 700 23px 'Arial', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; }
      .date { font: 700 31px 'Arial', sans-serif; }
      .tag { font: 800 18px 'Arial', sans-serif; letter-spacing: 0.04em; }
